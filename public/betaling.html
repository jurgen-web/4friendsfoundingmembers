<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Je betaling — 4 Friends</title><body style="background:#111;color:#fff;font:20px/1.6 Arial;padding:10vw"><p style="color:#c79a55">4 FRIENDS · FOUNDING MEMBERS</p><h1 id="title">We controleren je betaling.</h1><p id="status" role="status" aria-live="polite">Even geduld…</p><a style="color:white" href="/">Terug naar 4 Friends</a><script>
const token=new URLSearchParams(location.search).get('token');let tries=0;
async function check(){try{const r=await fetch('/.netlify/functions/status?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw Error(d.error);if(d.status==='paid'&&d.number){document.getElementById('title').textContent=d.mode==='test'?'Testbetaling geslaagd.':'Welkom bij de eerste 100.';document.getElementById('status').textContent=(d.mode==='test'?'Testnummer: #':'Jouw Founding-nummer: #')+String(d.number).padStart(3,'0')+(d.mode==='test'?'. Er is geen echt geld betaald.':'. Bewaar deze bevestiging.');return}if(['failed','canceled','expired'].includes(d.status)){document.getElementById('title').textContent='Je betaling is niet afgerond.';document.getElementById('status').textContent='Er is geen nummer toegekend. Je kunt teruggaan en opnieuw inschrijven.';return}document.getElementById('status').textContent='Je betaling is nog niet bevestigd. Een terugkeer vanaf Mollie is op zichzelf geen betaalbewijs.';if(++tries<20)setTimeout(check,3000);else document.getElementById('status').textContent='De bevestiging duurt langer. Bewaar deze pagina en vernieuw later, of contacteer jurgen@l2lconsulting.be. Start geen tweede betaling als er al geld is afgeschreven.'}catch{document.getElementById('status').textContent='De betaalstatus is tijdelijk niet beschikbaar. Vernieuw later of contacteer jurgen@l2lconsulting.be. Start geen tweede betaling als er al geld is afgeschreven.'}}
check();</script></body></html>
